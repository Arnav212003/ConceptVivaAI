# Render Blueprint for the backend on the free plan: one web service that runs
# migrations, the judge worker and the API (see backend/start.sh), plus Redis.
# Frontend: Vercel. Database: Neon. Code execution: Judge0 CE on RapidAPI.
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: conceptviva-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"             # free instances have 512 MB
      - key: DATABASE_URL
        sync: false            # Neon: postgresql://USER:PASSWORD@HOST/DB?sslmode=require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: conceptviva-redis
          property: connectionString
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false            # https://<your-app>.vercel.app
      - key: CORS_ORIGINS
        sync: false            # same as FRONTEND_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "2"             # Vercel function -> Render proxy -> app
      - key: JUDGE_ENABLED
        value: "true"
      - key: JUDGE_EXECUTOR
        value: judge0
      - key: JUDGE0_URL
        value: https://judge0-ce.p.rapidapi.com
      - key: JUDGE0_API_KEY
        sync: false            # RapidAPI key
      - key: JUDGE0_DAILY_LIMIT
        value: "50"            # RapidAPI Basic plan
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false            # https://<your-app>.vercel.app/api/auth/google/callback
      - key: METRICS_TOKEN
        generateValue: true
      - key: ANALYTICS_ADMIN_TOKEN
        generateValue: true

  - type: keyvalue
    name: conceptviva-redis
    plan: free
    ipAllowList: []            # reachable only from Render services in this account
