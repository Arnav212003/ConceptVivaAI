name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conceptviva_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      GEMINI_API_KEY: ""
      SESSION_SECRET_KEY: dummy_secret_for_ci_only
      DISABLE_RATE_LIMITING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests (SQLite, fakeredis, Linux rlimits in the judge)
        run: python -m pytest -q

      - name: Migrations on PostgreSQL (upgrade, full downgrade, upgrade)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/conceptviva_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Grader benchmark pipeline (offline, synthetic data)
        run: |
          python -m benchmarks.grader.run_benchmark \
            --dataset benchmarks/grader/data/synthetic_seed.jsonl \
            --grader fooled_model --out-dir /tmp/bench

  frontend:
    name: Frontend lint, unit tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker images and compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        env:
          SESSION_SECRET_KEY: ci_only
          SANDBOX_SHARED_SECRET: ci_only
        run: docker compose config --quiet

      - name: Build images
        run: |
          docker build -t conceptviva-api ./backend
          docker build -t conceptviva-sandbox -f backend/Dockerfile.sandbox ./backend
          docker build -t conceptviva-frontend .
